<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1e30"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </radialGradient>
    <radialGradient id="enamel" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0e8d8"/>
      <stop offset="60%" stop-color="#ddd0b8"/>
      <stop offset="100%" stop-color="#c8b898"/>
    </radialGradient>
    <radialGradient id="inflameGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="root" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b898"/>
      <stop offset="100%" stop-color="#9a8060"/>
    </linearGradient>
    <radialGradient id="abscess" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="pulp" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)" rx="16"/>
  <ellipse cx="100" cy="110" rx="65" ry="65" fill="url(#inflameGlow)"/>
  <g filter="url(#shadow)">
    <!-- Crown with cavity -->
    <path d="M72,70 Q72,37 100,33 Q128,37 128,70 L124,80 Q112,85 100,85 Q88,85 76,80 Z" fill="url(#enamel)"/>
    <!-- Cavity/decay on crown -->
    <ellipse cx="105" cy="52" rx="10" ry="8" fill="#4a3520"/>
    <ellipse cx="105" cy="50" rx="7" ry="5" fill="#2a1810"/>
    <!-- Cusps -->
    <ellipse cx="84" cy="38" rx="8" ry="5" fill="url(#enamel)"/>
    <ellipse cx="116" cy="38" rx="8" ry="5" fill="url(#enamel)"/>
    <!-- Highlight -->
    <path d="M78,50 Q78,44 92,42 Q96,44 96,50 Q96,55 88,56 Q78,55 78,50 Z" fill="rgba(255,255,255,0.25)"/>
    <!-- Neck -->
    <rect x="82" y="80" width="36" height="12" rx="4" fill="#b8a880"/>
    <!-- Root with internal pulp showing -->
    <path d="M86,92 L84,142 Q84,152 92,152 L92,92 Z" fill="url(#root)"/>
    <path d="M108,92 L116,142 Q116,152 108,152 L108,92 Z" fill="url(#root)"/>
    <!-- Pulp chamber (inflamed - red) -->
    <path d="M90,68 L90,92 L88,135 Q88,142 92,142 L92,68 Q96,65 100,68 L108,68 L108,92 L110,135 Q110,142 106,142 L106,68 Z" fill="url(#pulp)" opacity="0.6"/>
  </g>
  <!-- Periapical abscess -->
  <g filter="url(#glow)">
    <ellipse cx="88" cy="155" rx="18" ry="15" fill="url(#abscess)" opacity="0.7"/>
    <ellipse cx="85" cy="152" rx="8" ry="6" fill="rgba(251,191,36,0.4)"/>
    <!-- Pus/inflammation radiating lines -->
    <line x1="88" y1="170" x2="88" y2="178" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
    <line x1="75" y1="162" x2="68" y2="168" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
    <line x1="102" y1="162" x2="108" y2="168" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
    <line x1="78" y1="155" x2="70" y2="155" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
    <line x1="98" y1="155" x2="106" y2="155" stroke="#ef4444" stroke-width="1" opacity="0.4"/>
  </g>
  <!-- Swelling indication -->
  <path d="M60,160 Q74,170 88,172 Q102,170 116,165 Q130,158 140,162" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="100" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#F59E0B" opacity="0.9">ABSCESS</text>
</svg>