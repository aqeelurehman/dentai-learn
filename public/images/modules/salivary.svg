<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1528"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </radialGradient>
    <radialGradient id="salGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gland" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="40%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </radialGradient>
    <radialGradient id="gland2" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fbb6ce"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </radialGradient>
    <radialGradient id="mucocele" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="40%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>
    <linearGradient id="duct" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="tissue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)" rx="16"/>
  <ellipse cx="100" cy="100" rx="70" ry="70" fill="url(#salGlow)"/>

  <!-- Parotid gland (large, main gland) -->
  <g filter="url(#shadow)">
    <path d="M50,55 Q35,60 30,80 Q28,100 35,115 Q42,130 55,132 Q68,134 78,125 Q88,115 88,95 Q88,75 80,65 Q72,55 60,52 Z" fill="url(#gland)" opacity="0.85"/>
    <!-- Lobular texture -->
    <circle cx="48" cy="78" r="10" fill="rgba(249,168,212,0.2)" stroke="rgba(249,168,212,0.15)" stroke-width="0.5"/>
    <circle cx="58" cy="95" r="12" fill="rgba(249,168,212,0.2)" stroke="rgba(249,168,212,0.15)" stroke-width="0.5"/>
    <circle cx="45" cy="105" r="9" fill="rgba(249,168,212,0.2)" stroke="rgba(249,168,212,0.15)" stroke-width="0.5"/>
    <circle cx="65" cy="75" r="8" fill="rgba(249,168,212,0.2)" stroke="rgba(249,168,212,0.15)" stroke-width="0.5"/>
    <circle cx="55" cy="118" r="8" fill="rgba(249,168,212,0.15)"/>
    <!-- Highlight -->
    <ellipse cx="50" cy="70" rx="12" ry="8" fill="rgba(255,255,255,0.15)"/>
  </g>

  <!-- Stensen's duct -->
  <path d="M78,95 Q95,92 110,88 Q125,84 135,80" fill="none" stroke="url(#duct)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Duct lumen -->
  <path d="M78,95 Q95,92 110,88 Q125,84 135,80" fill="none" stroke="rgba(255,200,220,0.3)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Submandibular gland -->
  <g filter="url(#shadow)">
    <ellipse cx="140" cy="130" rx="30" ry="22" fill="url(#gland2)" opacity="0.75"/>
    <!-- Lobular texture -->
    <circle cx="132" cy="125" r="8" fill="rgba(244,114,182,0.2)"/>
    <circle cx="148" cy="128" r="7" fill="rgba(244,114,182,0.2)"/>
    <circle cx="140" cy="138" r="6" fill="rgba(244,114,182,0.15)"/>
    <ellipse cx="135" cy="122" rx="8" ry="5" fill="rgba(255,255,255,0.1)"/>
  </g>

  <!-- Wharton's duct -->
  <path d="M125,120 Q115,110 105,108 Q95,106 88,110" fill="none" stroke="url(#duct)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Mucocele (translucent blue dome) -->
  <g filter="url(#glow)">
    <ellipse cx="88" cy="112" rx="14" ry="11" fill="url(#mucocele)" opacity="0.6"/>
    <ellipse cx="85" cy="109" rx="6" ry="4" fill="rgba(165,243,252,0.4)"/>
    <!-- Duct rupture indicator -->
    <line x1="95" y1="108" x2="100" y2="108" stroke="#EC4899" stroke-width="2" stroke-dasharray="2,2" opacity="0.7"/>
  </g>

  <!-- Sublingual gland -->
  <g filter="url(#shadow)" opacity="0.6">
    <ellipse cx="100" cy="155" rx="20" ry="10" fill="url(#gland2)"/>
    <ellipse cx="96" cy="152" rx="6" ry="4" fill="rgba(255,255,255,0.1)"/>
  </g>

  <!-- Saliva droplets -->
  <g opacity="0.5">
    <circle cx="138" cy="75" r="3" fill="#67e8f9"/>
    <circle cx="142" cy="72" r="2" fill="#67e8f9"/>
    <circle cx="135" cy="72" r="1.5" fill="#67e8f9"/>
  </g>

  <text x="100" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#EC4899" opacity="0.9">SALIVARY GLANDS</text>
</svg>