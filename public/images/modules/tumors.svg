<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2040"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </radialGradient>
    <radialGradient id="enamel" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="60%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#d4c3a0"/>
    </radialGradient>
    <radialGradient id="tumorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="root" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c3a0"/>
      <stop offset="100%" stop-color="#a08860"/>
    </linearGradient>
    <radialGradient id="tumor" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)" rx="16"/>
  <ellipse cx="100" cy="105" rx="70" ry="70" fill="url(#tumorGlow)"/>
  <g filter="url(#shadow)">
    <!-- Crown -->
    <path d="M72,70 Q72,37 100,33 Q128,37 128,70 L124,80 Q112,85 100,85 Q88,85 76,80 Z" fill="url(#enamel)"/>
    <path d="M80,52 Q80,46 100,43 Q110,45 112,52 Q112,58 100,60 Q88,58 80,52 Z" fill="rgba(255,255,255,0.3)"/>
    <!-- Cusps -->
    <ellipse cx="86" cy="38" rx="8" ry="5" fill="url(#enamel)"/>
    <ellipse cx="100" cy="35" rx="7" ry="4" fill="url(#enamel)"/>
    <ellipse cx="114" cy="38" rx="8" ry="5" fill="url(#enamel)"/>
    <!-- Neck -->
    <rect x="82" y="80" width="36" height="12" rx="4" fill="#c9b89a"/>
    <!-- Root -->
    <path d="M85,92 L82,140 Q82,150 90,150 L90,92 Z" fill="url(#root)"/>
    <path d="M110,92 L118,140 Q118,150 110,150 L110,92 Z" fill="url(#root)"/>
  </g>
  <!-- Tumor mass - multilocular soap-bubble appearance -->
  <g filter="url(#glow)">
    <ellipse cx="130" cy="115" rx="28" ry="24" fill="url(#tumor)" opacity="0.7"/>
    <ellipse cx="120" cy="130" rx="18" ry="16" fill="url(#tumor)" opacity="0.6"/>
    <ellipse cx="140" cy="100" rx="14" ry="12" fill="url(#tumor)" opacity="0.55"/>
    <ellipse cx="135" cy="135" rx="12" ry="10" fill="url(#tumor)" opacity="0.5"/>
    <!-- Internal septations -->
    <path d="M118,105 Q130,115 125,135" fill="none" stroke="rgba(196,132,252,0.4)" stroke-width="1"/>
    <path d="M135,98 Q140,115 132,130" fill="none" stroke="rgba(196,132,252,0.4)" stroke-width="1"/>
    <!-- Highlight -->
    <ellipse cx="125" cy="108" rx="8" ry="6" fill="rgba(196,132,252,0.25)"/>
  </g>
  <!-- Bone erosion lines -->
  <path d="M55,160 Q70,155 85,158 Q100,162 115,156 Q130,150 145,158" fill="none" stroke="#4a3060" stroke-width="2" opacity="0.6"/>
  <text x="100" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#8B5CF6" opacity="0.9">TUMOR</text>
</svg>